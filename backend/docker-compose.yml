version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: voicecall-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voicecall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: voicecall-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=voicecall
      - USE_SQLITE=false
      - USE_MOCK_AI=true  # Set to false to try running Whisper/translation locally if faster-whisper is added
      - JWT_SECRET_KEY=dockersecretkeyforrealtimevoipcallingapp
    depends_on:
      - db
    volumes:
      - ./media:/app/media

volumes:
  postgres_data:
